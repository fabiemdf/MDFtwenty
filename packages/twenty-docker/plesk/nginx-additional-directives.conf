# Paste into Plesk: domain → Apache & nginx Settings → Additional nginx
# directives. Disable "Proxy mode" and click Apply BEFORE adding this file,
# otherwise Plesk rejects a duplicate location /.
#
# This snippet is inserted into Plesk's existing virtual host.
# Do not add a surrounding virtual-host wrapper or http-level map.

client_max_body_size 50m;

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# AI chat and GraphQL streams hang if nginx buffers the response.
location ~* ^/(api/.*stream|graphql/stream) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering no always;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
